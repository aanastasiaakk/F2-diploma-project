openapi: 3.0.3
info:
  title: Wardrobe Platform API
  version: "1.0.0"
  description: >
    Специфікація REST-інтерфейсу взаємодії Web SPA з Backend API
    (контейнери за C4 Level 2, підрозділ 2.2).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    WardrobeItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
        color:
          type: string
        season:
          type: string
        status:
          type: string
          enum: [PROCESSING, READY, FAILED]

    Recommendation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        outfit_id:
          type: string
          format: uuid
        score:
          type: number
          format: float
        status:
          type: string
          enum: [PENDING, RATED]

paths:
  /api/v1/auth/login:
    post:
      summary: Автентифікація користувача
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Успішна автентифікація, видано JWT-токен
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
        '400':
          description: Невалідний формат email/пароля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Невірні облікові дані
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/wardrobe/items:
    post:
      summary: Завантаження фото речі гардероба на асинхронну обробку
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Річ прийнято в чергу на класифікацію
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardrobeItem'
        '400':
          description: Файл не є зображенням або перевищує ліміт розміру
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Відсутній або недійсний токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Перевищено ліміт запитів на завантаження (Rate Limiting)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/recommendations:
    get:
      summary: Отримання персоналізованих рекомендацій образів
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список рекомендацій користувача
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recommendation'
        '401':
          description: Відсутній або недійсний токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
